name: waimea-wavecast-backend
x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped
  networks: [waimea-internal]

services:
  # For local development only. Cloud SQL takes its place in production.
  postgres-local:
    image: postgres:17-alpine
    profiles: [devdb]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waimea_wavecast}
      POSTGRES_USER: ${POSTGRES_USER:-waimea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-}
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    networks: [waimea-internal]

  database-api:
    <<: *worker
    command: uvicorn services.database_api.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - '127.0.0.1:8000:8000'

  ingestion:
    <<: *worker
    command: uvicorn services.ingestion.app.main:app --host 0.0.0.0 --port 8000

  preprocessing:
    <<: *worker
    command: uvicorn services.preprocessing.app.main:app --host 0.0.0.0 --port 8000
    mem_limit: 768m
    cpus: 0.75

  pipeline-scheduler:
    <<: *worker
    command: python -m services.scheduler.app.tl07b_runner
    mem_limit: 256m
    cpus: 0.25

  historical-backfill:
    <<: *worker
    profiles: [historical]
    command: python -m services.ingestion.scripts.historical_backfill --max-files 1
    restart: "no"
    mem_limit: 1536m
    cpus: 0.50

  analysis:
    <<: *worker
    build:
      context: .
      dockerfile: services/analysis/Dockerfile
    command: uvicorn services.analysis.app.main:app --host 0.0.0.0 --port 8000

  clustering:
    <<: *worker
    build:
      context: .
      dockerfile: services/clustering/Dockerfile
    command: uvicorn services.clustering.app.main:app --host 0.0.0.0 --port 8000

  prediction:
    <<: *worker
    build:
      context: .
      dockerfile: services/prediction/Dockerfile
    command: uvicorn services.prediction.app.main:app --host 0.0.0.0 --port 8000

  classification:
    <<: *worker
    build:
      context: .
      dockerfile: services/classification/Dockerfile
    command: uvicorn services.classification.app.main:app --host 0.0.0.0 --port 8000

  scheduler:
    <<: *worker
    profiles: [tl05-scheduler]
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    command: python -m services.scheduler.app.runner

networks:
  waimea-internal:

volumes:
  postgres_dev:
