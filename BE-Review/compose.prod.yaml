# Launch with: docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Requires valid host certificates at /etc/letsencrypt/live/apiwaimea.liems.io.vn/.
services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
