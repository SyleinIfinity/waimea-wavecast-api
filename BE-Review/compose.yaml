# Scaffold only: demonstrates 8 FastAPI processes + proxy network topology.
# Application business endpoints, scheduler jobs, SQL persistence and GCS upload
# are NOT implemented; health/live is only process liveness.
x-waimea-app: &waimea-app
  build:
    context: .
    dockerfile: Dockerfile
  image: waimea-wavecast/backend-scaffold:local
  networks:
    - internal
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s

services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.27.0
    command: ["--address=0.0.0.0", "--port=5432", "${INSTANCE_CONNECTION_NAME:?Set INSTANCE_CONNECTION_NAME in .env}"]
    networks: [internal]
    restart: unless-stopped
    # Uses the Compute Engine VM's attached service account / metadata credentials.
    # No published DB port. For local development supply Application Default Credentials.

  database-api:
    <<: *waimea-app
    env_file: .env   # Only database-api receives DB_PASSWORD.
    environment:
      SERVICE_NAME: database-api
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    depends_on:
      cloud-sql-proxy:
        condition: service_started

  ingestion:
    <<: *waimea-app
    environment:
      SERVICE_NAME: ingestion
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      GCS_BUCKET: ${GCS_BUCKET:?Set GCS_BUCKET in .env}
    depends_on:
      database-api:
        condition: service_healthy

  preprocessing:
    <<: *waimea-app
    environment:
      SERVICE_NAME: preprocessing
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    depends_on:
      database-api:
        condition: service_healthy

  analysis:
    <<: *waimea-app
    environment:
      SERVICE_NAME: analysis
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    depends_on:
      database-api:
        condition: service_healthy

  clustering:
    <<: *waimea-app
    environment:
      SERVICE_NAME: clustering
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      GCS_BUCKET: ${GCS_BUCKET:?Set GCS_BUCKET in .env}
    depends_on:
      database-api:
        condition: service_healthy

  prediction:
    <<: *waimea-app
    environment:
      SERVICE_NAME: prediction
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      GCS_BUCKET: ${GCS_BUCKET:?Set GCS_BUCKET in .env}
    depends_on:
      database-api:
        condition: service_healthy

  classification:
    <<: *waimea-app
    environment:
      SERVICE_NAME: classification
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      GCS_BUCKET: ${GCS_BUCKET:?Set GCS_BUCKET in .env}
    depends_on:
      database-api:
        condition: service_healthy

  scheduler:
    <<: *waimea-app
    environment:
      SERVICE_NAME: scheduler
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    depends_on:
      database-api:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.http.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - edge
      - internal
    depends_on:
      database-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge: {}
  internal: {}  # Private-by-no-published-port; allows required outbound NOAA/GCP HTTPS.
