# HTTPS public gateway. Requires certbot or equivalent to provision certificates.
server {
    listen 80;
    server_name apiwaimea.liems.io.vn;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name apiwaimea.liems.io.vn;

    ssl_certificate /etc/letsencrypt/live/apiwaimea.liems.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apiwaimea.liems.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health/live {
        proxy_pass http://database-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Only the external REST interface is exposed; do not proxy /internal/v1/.
    location /api/v1/ {
        proxy_pass http://database-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
