# TLS termination is added by the deployment host. Only public/admin API is routed.
server {
    listen 80;
    server_name apiwaimea.liems.io.vn;
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://127.0.0.1:8000; }
    location = /health/live { proxy_pass http://127.0.0.1:8000; }
    location = /health/ready { proxy_pass http://127.0.0.1:8000; }
    location / { return 404; }
}
