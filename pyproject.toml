[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "waimea-wavecast-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary,pool]>=3.2,<4", "pydantic-settings>=2.8,<3", "httpx>=0.27,<1",
  "requests>=2.32,<3", "pydantic>=2,<3", "google-cloud-storage>=2.18,<4"
]
[project.optional-dependencies]
ml = ["pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.5,<2", "joblib>=1.4,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
